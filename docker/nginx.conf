# DO-NOT-CHANGE: see DO-NOT-CHANGE/INVARIANTS.md — CSP and /api proxy to engine:8001 are
# security contracts; don't relax them and never bypass the proxy for media
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 20G;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self'; script-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ready\n";
  }

  resolver 127.0.0.11 valid=10s;
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
  }

  location = /sw.js {
    default_type application/javascript;
    expires -1;
    try_files $uri =404;
  }

  location /api/ {
    set $engine_upstream http://engine:8001;
    proxy_pass $engine_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2)$ {
    expires 7d;
    try_files $uri =404;
  }

  # The HTML shell must revalidate so a rebuilt hashed bundle is not pinned by
  # an old cached index. Hashed JS/CSS assets retain the immutable-ish cache
  # policy above.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
