# DO-NOT-CHANGE: see DO-NOT-CHANGE/INVARIANTS.md — data bind mount (/app/data), engine port
# and env defaults are contracts; changing them breaks deployments
name: s6-cut

services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    restart: unless-stopped
    init: true
    cpus: 0.75
    mem_reservation: 128m
    mem_limit: 384m
    memswap_limit: 512m
    pids_limit: 128
    networks:
      - private
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:4416/ping'); if (!r.ok) Deno.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    restart: unless-stopped
    depends_on:
      pot-provider:
        condition: service_healthy
    environment:
      S6_DATA_PATH: /app/data
      S6_BUILD_REVISION: ${S6_BUILD_REVISION:-unknown}
      S6_WHISPER_MODEL: ${S6_WHISPER_MODEL:-base}
      S6_WHISPER_DEVICE: ${S6_WHISPER_DEVICE:-cpu}
      S6_WHISPER_COMPUTE_TYPE: ${S6_WHISPER_COMPUTE_TYPE:-int8}
      S6_WHISPER_BEAM_SIZE: ${S6_WHISPER_BEAM_SIZE:-1}
      S6_WHISPER_WORD_TIMESTAMPS: ${S6_WHISPER_WORD_TIMESTAMPS:-true}
      S6_MUSIC_WHISPER_MODEL: ${S6_MUSIC_WHISPER_MODEL:-small}
      S6_MUSIC_WHISPER_BEAM_SIZE: ${S6_MUSIC_WHISPER_BEAM_SIZE:-5}
      S6_JOB_WORKERS: ${S6_JOB_WORKERS:-1}
      S6_MAX_QUEUED_JOBS: ${S6_MAX_QUEUED_JOBS:-4}
      S6_TRANSCRIPTION_STALL_SECONDS: ${S6_TRANSCRIPTION_STALL_SECONDS:-180}
      S6_MAX_UPLOAD_BYTES: ${S6_MAX_UPLOAD_BYTES:-20000000000}
      S6_MAX_SOURCE_SECONDS: ${S6_MAX_SOURCE_SECONDS:-14400}
      S6_MAX_LONG_SOURCE_SECONDS: ${S6_MAX_LONG_SOURCE_SECONDS:-28800}
      S6_JOB_RETENTION_DAYS: ${S6_JOB_RETENTION_DAYS:-30}
      S6_MAX_RETAINED_JOBS: ${S6_MAX_RETAINED_JOBS:-100}
      S6_MEDIA_URL_TTL_SECONDS: ${S6_MEDIA_URL_TTL_SECONDS:-900}
      S6_YTDLP_CONNECT_TIMEOUT: ${S6_YTDLP_CONNECT_TIMEOUT:-45}
      S6_YTDLP_SETUP_TIMEOUT: ${S6_YTDLP_SETUP_TIMEOUT:-300}
      S6_YTDLP_INACTIVITY_TIMEOUT: ${S6_YTDLP_INACTIVITY_TIMEOUT:-300}
      S6_FAST_GUARD_SECONDS: ${S6_FAST_GUARD_SECONDS:-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - type: bind
        source: ${S6_DATA_PATH:-./data}
        target: /app/data
    networks:
      - private
    # Loopback-only binding: this published port is reachable only from the
    # host at http://localhost:${S6_ENGINE_PORT:-8001}, for local debugging,
    # and nginx is the only container that publishes to the network.
    #
    # It is NOT an access control for the API. The web service proxies /api/
    # (including /api/docs) straight through to this engine with no
    # authentication, so every endpoint here — project deletion and Library
    # purge included — is reachable from whatever interfaces S6_PORT binds the
    # frontend to. Narrow S6_PORT, or firewall it, to restrict that.
    ports:
      - "127.0.0.1:${S6_ENGINE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    stop_grace_period: 30s
    cpus: 4.0
    mem_reservation: 1g
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: 0.5
    mem_reservation: 64m
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "${S6_PORT:-8080}:8080"
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  private:
    internal: false
