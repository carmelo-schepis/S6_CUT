# S6_cut for TrueNAS SCALE: Apps -> Discover Apps -> ⋮ -> Install via YAML
#
# Uses the prebuilt images from GitHub Container Registry, so nothing is built
# on the NAS and no shell is needed. Before you paste:
#
#   1. Create a dataset for the data, for example tank/apps/s6-cut/data
#      (Datasets -> Add Dataset; Dataset Preset: Generic).
#   2. Replace /mnt/tank/apps/s6-cut/data below (it appears twice) with that
#      dataset's path.
#   3. Change 30180 under web -> ports if that port is already used.
#
# Then name the app s6-cut, paste this file, and open http://<NAS-IP>:30180
# once the app shows Running (the engine takes about two minutes to start).
# Update: when TrueNAS offers an update for the app, click Update; it pulls the
# newer :latest images and redeploys. To force it from System -> Shell:
#   midclt call -j app.pull_images s6-cut '{"redeploy": true}'
#
# S6_cut has no authentication. Keep it on your LAN or a VPN and never forward
# its port from the internet.
#
# Kept in sync with compose.yaml by tests/installers/test_truenas.py.

services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    restart: unless-stopped
    init: true
    cpus: 0.75
    mem_reservation: 128m
    mem_limit: 384m
    memswap_limit: 512m
    pids_limit: 128
    networks:
      - private
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:4416/ping'); if (!r.ok) Deno.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Gives the engine user (UID 10001) ownership of the data dataset.
  data-init:
    image: ghcr.io/carmelo-schepis/s6-cut-engine:latest
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["sh", "-c", "find /app/data ! -user 10001 -exec chown -h 10001:10001 {} + || true"]
    volumes:
      - type: bind
        source: /mnt/tank/apps/s6-cut/data
        target: /app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH

  engine:
    image: ghcr.io/carmelo-schepis/s6-cut-engine:latest
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
      pot-provider:
        condition: service_healthy
    environment:
      S6_DATA_PATH: /app/data
      S6_BUILD_REVISION: unknown
      S6_WHISPER_MODEL: base
      S6_WHISPER_DEVICE: cpu
      S6_WHISPER_COMPUTE_TYPE: int8
      S6_WHISPER_BEAM_SIZE: "1"
      S6_WHISPER_WORD_TIMESTAMPS: "true"
      S6_MUSIC_WHISPER_MODEL: small
      S6_MUSIC_WHISPER_BEAM_SIZE: "5"
      S6_JOB_WORKERS: "1"
      S6_MAX_QUEUED_JOBS: "4"
      S6_TRANSCRIPTION_STALL_SECONDS: "180"
      S6_MAX_UPLOAD_BYTES: "20000000000"
      S6_MAX_SOURCE_SECONDS: "14400"
      S6_MAX_LONG_SOURCE_SECONDS: "28800"
      S6_JOB_RETENTION_DAYS: "30"
      S6_MAX_RETAINED_JOBS: "100"
      S6_MEDIA_URL_TTL_SECONDS: "900"
      S6_YTDLP_CONNECT_TIMEOUT: "45"
      S6_YTDLP_SETUP_TIMEOUT: "300"
      S6_YTDLP_INACTIVITY_TIMEOUT: "300"
      S6_FAST_GUARD_SECONDS: "1"
      OPENROUTER_API_KEY: ""
    volumes:
      - type: bind
        source: /mnt/tank/apps/s6-cut/data
        target: /app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - private
    # No host port: the web service below is the only way in. (compose.yaml
    # also binds the engine to 127.0.0.1:8001 for local debugging.)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    stop_grace_period: 30s
    cpus: 4.0
    mem_reservation: 1g
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512

  web:
    image: ghcr.io/carmelo-schepis/s6-cut-web:latest
    restart: unless-stopped
    cpus: 0.5
    mem_reservation: 64m
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "30180:8080"
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  private:
    internal: false
